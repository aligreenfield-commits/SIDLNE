<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Install SIDLNE</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f3; color: #171a16; }
    main { max-width: 700px; margin: 72px auto; padding: 24px; }
    .card { background: #fff; border: 1px solid #dfe4d8; border-radius: 18px; padding: 28px; box-shadow: 0 16px 50px rgba(23,26,22,0.08); }
    h1 { margin-top: 0; font-size: clamp(2rem, 4vw, 3rem); letter-spacing: -0.06em; }
    p, li { line-height: 1.6; color: #58654c; }
    .badge { display: inline-block; padding: 6px 10px; border-radius: 999px; background: #c5f65a; color: #171a16; font-weight: 800; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    a { color: #566d3e; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="badge">SIDLNE Demo</div>
      <h1>Install on your iPhone</h1>
      <p>This demo is meant to feel like an app. On iPhone, you can add it to the Home Screen for a cleaner, app-like experience.</p>
      <ol>
        <li>Open this page in Safari.</li>
        <li>Tap the Share button.</li>
        <li>Select “Add to Home Screen”.</li>
        <li>Tap “Add” to finish.</li>
      </ol>
      <p><a href="/">Return to the app</a></p>
    </div>
  </main>
</body>
</html>
