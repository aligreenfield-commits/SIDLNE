# Applies the database schema in infra/supabase/migrations to Supabase.
# Migrations are idempotent, so running this again is safe.
#
# Setup: add SUPABASE_DB_URL as a repository secret (Project Settings >
# Database > Connection string > URI), then run from the Actions tab.

name: Run Supabase migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: ./infra/scripts/migrate.sh
