# Deploys the sync-calendar Edge Function to Supabase on every push to main.
#
# The web app itself is published by GitHub Pages straight from the main
# branch, using the Supabase settings in config.js.
#
# One-time setup (Settings > Secrets and variables > Actions):
#   Variable: SUPABASE_PROJECT_REF   e.g. abcd1234
#   Secret:   SUPABASE_ACCESS_TOKEN  from supabase.com/dashboard/account/tokens
# Until both are set, this workflow skips the deploy instead of failing.

name: Deploy calendar sync

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-function:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Skip when not configured
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == ''
        run: echo "::notice::Set SUPABASE_ACCESS_TOKEN (secret) and SUPABASE_PROJECT_REF (variable) to deploy the calendar sync function automatically."
      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        with:
          version: latest
      - name: Deploy sync-calendar
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: supabase functions deploy sync-calendar --project-ref "$SUPABASE_PROJECT_REF"
