# Runs a one-off data fix from infra/supabase/fixes/ against the live database
# (Actions > Run data fix > Run workflow, then pick the file).

name: Run data fix

on:
  workflow_dispatch:
    inputs:
      file:
        description: "File name in infra/supabase/fixes/"
        required: true

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: NEW KEYS
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'reufyrhowxxivpmobouz' }}
      FIX_FILE: ${{ inputs.file }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply the fix
        run: |
          set -euo pipefail
          [[ "$FIX_FILE" =~ ^[A-Za-z0-9._-]+\.sql$ ]] || { echo "::error::Give a .sql file name from infra/supabase/fixes/"; exit 1; }
          f="infra/supabase/fixes/$FIX_FILE"
          [ -f "$f" ] || { echo "::error::$f not found"; exit 1; }
          token="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')"
          # Shape check (never prints the token): Supabase access tokens start with sbp_
          if [ -z "$token" ]; then echo "::error::SUPABASE_ACCESS_TOKEN is empty."; exit 1; fi
          case "$token" in
            sbp_*) echo "Token looks like a Supabase access token (sbp_…, ${#token} characters, fingerprint $(printf %s "$token" | sha256sum | cut -c1-8))." ;;
            eyJ*|sb_secret_*|sb_publishable_*) echo "::error::SUPABASE_ACCESS_TOKEN holds a project API key, not an account access token. Make one at supabase.com/dashboard/account/tokens (it starts with sbp_)."; exit 1 ;;
            *) echo "::warning::SUPABASE_ACCESS_TOKEN doesn't start with sbp_ (${#token} characters); it may not be a Supabase access token." ;;
          esac
          jq -n --rawfile q "$f" '{query: $q}' > body.json
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data @body.json)
          echo "HTTP $status"
          cat response.json; echo
          [ "$status" -lt 300 ] || { echo "::error::The fix failed (HTTP $status); nothing was changed if it raised an error."; exit 1; }
